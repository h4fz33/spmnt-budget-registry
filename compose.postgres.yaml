services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: schoolbanchee_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schoolbanchee_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - schoolbanchee-postgres-test:/var/lib/postgresql/data

volumes:
  schoolbanchee-postgres-test:

