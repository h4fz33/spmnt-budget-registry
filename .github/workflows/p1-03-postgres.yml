name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schoolbanchee_test?schema=public
      NEXTAUTH_URL: http://localhost:6000
      NEXTAUTH_SECRET: synthetic-ci-secret-for-quality-verification-only
      SCHOOL_SEED_ESAO_CODE: "1000960001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run configuration verification
        run: npm run verify:env
      - name: Run unit tests
        run: node --experimental-strip-types --test tests/unit/*.test.ts
      - name: Check Prisma formatting
        run: npx prisma format --check
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Verify deterministic acceptance fixtures
        run: npm run verify:p0-09

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolbanchee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolbanchee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schoolbanchee_test?schema=public
      NEXTAUTH_URL: http://localhost:6000
      NEXTAUTH_SECRET: synthetic-ci-secret-for-postgres-verification-only
      SCHOOL_SEED_ESAO_CODE: "1000960001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:test
      - run: npm run db:seed:test
      - run: npm run db:seed:test
      - name: Create synthetic System Admin bootstrap for structural verification
        env:
          BOOTSTRAP_ADMIN_EMAIL: p1-17-ci@synthetic.test
          BOOTSTRAP_ADMIN_PASSWORD: Synthetic-P1-17-Initial-Password
        run: node --conditions=react-server --experimental-strip-types scripts/bootstrap-first-system-admin.mjs
      - name: Create synthetic SESAO Auditor bootstrap for structural verification
        run: |
          node --conditions=react-server --experimental-strip-types --input-type=module -e '
            import { bootstrapSesaoAuditors } from "./src/lib/bootstrap/sesao-auditor.ts"
            import { createDatabaseClient } from "./scripts/db-client.mjs"
            const database = createDatabaseClient({ requestedMode: "test" })
            try {
              await bootstrapSesaoAuditors(database.client, {
                accounts: [{
                  accountIdentifier: "p1-19-ci@synthetic.test",
                  password: "Synthetic-P1-19-Initial-Password",
                  personName: "P1-19 CI Auditor",
                }],
              })
            } finally {
              await database.client.$disconnect()
            }
          '
      - name: Run PostgreSQL structural verifiers
        run: |
          for verifier in scripts/verify-p1-*.mjs; do
            node scripts/run-db-test.mjs node --conditions=react-server --experimental-strip-types "$verifier"
          done
      - name: Run PostgreSQL integration tests
        run: node scripts/run-db-test.mjs node --conditions=react-server --experimental-strip-types --test tests/integration/*.test.ts

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      NODE_ENV: production
      DATABASE_URL: postgresql://ci:ci@db.invalid:5432/schoolbanchee_ci?schema=public
      NEXTAUTH_URL: https://schoolbanchee.example.invalid
      NEXTAUTH_SECRET: synthetic-ci-secret-for-production-build-verification-only
      SCHOOL_SEED_ESAO_CODE: "1000960001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Generate Prisma Client
        run: npm run db:generate
      - run: npm run build
